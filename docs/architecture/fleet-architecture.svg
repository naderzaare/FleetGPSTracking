<style>text{font-family:Tahoma,Arial,sans-serif}.fa{direction:rtl;unicode-bidi:plaintext;text-anchor:middle}.en{font-family:Arial,sans-serif;text-anchor:middle;letter-spacing:.5px}.body{font-size:16px;fill:#52657a}.heading{font-size:22px;font-weight:bold;fill:#17334d}.edge{fill:none;stroke:#2463a7;stroke-width:3;marker-end:url(#arrow)}.aux{fill:none;stroke:#72859a;stroke-width:2.3;stroke-dasharray:7 5;marker-end:url(#aux)}.icon{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}</style>
</defs><rect width="1800" height="1450" fill="#f3f6fa"/><rect width="1800" height="130" fill="#122d46"/>

<text x="900" y="56" class="fa" font-size="34" fill="#ffffff">معماری سامانهٔ ردیابی ناوگان</text>
<text x="900" y="94" class="fa" font-size="17" fill="#bfd2e3">جریان اطلاعات • استقرار در دیتاسنتر شرکت • مشخصات نسخهٔ ۱.۳</text>
<rect x="70" y="160" width="940" height="150" rx="16" fill="#e7eef6"/>
<text x="540" y="199" class="fa heading" font-size="23">۳۰۰ دستگاه در شروع  |  ظرفیت آزمون: ۱۰۰۰ دستگاه</text>
<text x="540" y="237" class="fa body">سرویس‌های برنامه: Linux  •  پایگاه داده: Windows VM  •  زیرساخت: VMware</text>
<text x="540" y="273" class="fa body">فقط موقعیت و زمان GPS؛ حرکت و توقف، وضعیت موتور را مشخص نمی‌کنند.</text>
