<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1450" viewBox="0 0 1800 1450" role="img" aria-labelledby="title desc">
<title id="title">معماری سامانه ردیابی ناوگان و جریان اطلاعات</title><desc id="desc">دستگاه GPS به دریافت‌کننده، RabbitMQ، پردازشگر و SQL Server متصل است. وب و SignalR داده مجاز را به کاربران می‌رسانند. شبیه‌ساز، آرشیو خام، نقشه آفلاین و سرویس عملیات و پیامک نیز نمایش داده شده‌اند.</desc>
