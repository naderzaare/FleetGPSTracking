const modules = {
 receiver:{title:'دریافت‌کنندهٔ GPS',en:'Receiver Worker',tag:'Linux / .NET Worker',summary:'مرز ورود دادهٔ غیرقابل‌اعتماد دستگاه‌ها؛ مدیریت اتصال، قاب‌بندی، شناسایی و پاسخ پروتکل.',confirmed:['دریافت TCP/UDP با پورت مستقل برای خانواده‌های پروتکل روی IP مشترک، مطابق قابلیت واقعی دستگاه.','پاسخ ACK و heartbeat باید مطابق مستندات سازنده باشد؛ تضمین پذیرش پایدار نباید بدون تحقق آن اعلام شود.','سرویس مستقل از رابط کاربری و پردازش؛ امکان اجرای سفارشی روی Linux و Windows.'],responsibilities:['سقف طول بسته، تعداد اتصال، زمان انتظار و مصرف حافظه؛ کنترل اتصال‌های ناقص و پرحجم.','اتصال دستگاه به هویت ثبت‌شده و adapter مناسب؛ شماره IMEI به‌تنهایی احراز هویت قوی نیست.','حفظ زمان دریافت اصلی و مرجع بستهٔ خام؛ تفکیک شناسهٔ بسته از شناسهٔ هر fix.','انتشار رویداد با publisher confirm و تشخیص پیام بدون مسیر؛ مدیریت backpressure.'],data:'ورودی: بایت‌های TCP/UDP. خروجی: رویداد نرمال‌شده، مرجع خام و آمار اتصال؛ بدون دسترسی به جداول کسب‌وکار.',risks:['پاسخ زودهنگام می‌تواند باعث حذف داده از حافظهٔ دستگاه پیش از ذخیرهٔ پایدار شود.','محدودیت ACK، نبود رمزنگاری، یا UDP بدون ارسال مجدد، تضمین انتها‌به‌انتها را محدود می‌کند.','توقف broker و پرشدن فضای محلی باید سیاست روشن پذیرش/رد داشته باشد.'],tests:['تقسیم و چسبیدن فریم‌های TCP، بستهٔ کوتاه یا بزرگ، timeout و ورودی مخرب.','قطع اتصال و crash پیش/پس از مرز ACK؛ تطبیق دادهٔ پذیرفته‌شده با ledger شبیه‌ساز.'],decisions:['D03','D04','D05'],links:['adapters','broker','raw','simulator']},
 adapters:{title:'آداپترهای مستقل پروتکل',en:'Protocol Adapters',tag:'Versioned libraries',summary:'هر خانوادهٔ پروتکل، رمزگشا و آزمون‌های مستقل دارد؛ منطق سازنده وارد منطق ناوگان نمی‌شود.',confirmed:['پشتیبانی از چند برند با adapter مستقل.','پروتکل دودویی/اختصاصی جدید به کد، تست و انتشار کنترل‌شده نیاز دارد.','قالب فرمانِ پشتیبانی‌شده قابل تنظیم در UI فنی است؛ قالب بسته یا API سازنده نباید ساخته و به‌عنوان واقعی معرفی شود.'],responsibilities:['قاب‌بندی stream/datagram، شناسایی، decode، heartbeat و ACK.','تعریف قابلیت‌های مدل و encode فرمان‌های مجاز؛ تفسیر پاسخ و قابلیت verification.','کلید dedup پروتکل‌محور، مدیریت rollover و بازراه‌اندازی sequence.','انتشار کتابخانهٔ کامپایل‌شده و نسخه‌دار؛ بارگذاری کد دلخواه توسط اپراتور پیشنهاد نمی‌شود.'],data:'یک بسته می‌تواند چند fix داشته باشد؛ heartbeat ممکن است هیچ مختصاتی نداشته باشد. adapter نباید SQL یا مجوز منطقه را مدیریت کند.',risks:['مستندات ناقص و firmwareهای متفاوت؛ ادعای سازگاری بدون تست سخت‌افزار.','شناسه‌های غیرمنحصربه‌فرد و پاسخ فرمانِ بدون correlation.'],tests:['نمونهٔ رسمی و capture واقعی، corpus نسخه‌دار، fuzzing، آزمون مرزی و سازگاری firmware.'],decisions:['D05','D09'],links:['receiver','simulator','commands']},
 broker:{title:'پیام‌رسان پایدار',en:'RabbitMQ',tag:'Internal network',summary:'جداکردن دریافت از پردازش، جذب نوسان بار و امکان بازیابی کنترل‌شده.',confirmed:['صف پایدار، publisher confirm، retry محدود، dead-letter، مصرف‌کنندهٔ idempotent و backpressure.','پورت مدیریت و خود broker عمومی نشوند.'],responsibilities:['پیام persistent روی صف durable؛ تشخیص unroutable publication در کنار confirm.','مصرف با manual acknowledgment و prefetch محدود؛ ACK پس از commit در SQL.','retry با تأخیر و سقف؛ poison message در قرنطینه با امکان بررسی و بازپخش ممیزی‌شده.','ارزیابی quorum queue با سه node در failure domain مستقل برای تولید.'],data:'صف‌های ورودی telemetry و جریان‌های کاری؛ RabbitMQ جایگزین تاریخچهٔ SQL یا آرشیو ۳۶۵ روزه نیست.',risks:['confirm ناشر با ACK مصرف‌کننده متفاوت است و تراکنش SQL را پوشش نمی‌دهد.','صف مشترک competing-consumer به‌تنهایی fan-out به همهٔ نمونه‌های Web ایجاد نمی‌کند.','سه VM روی یک میزبان فیزیکی، تحمل خرابی میزبان نمی‌دهد.'],tests:['restart، قطع ارتباط، redelivery پس از commit، backlog و پرشدن disk؛ خرابی node در توپولوژی منتخب.'],decisions:['D03','D04','D06'],links:['receiver','processor','web','operations']},
 processor:{title:'پردازش و وضعیت جاری',en:'Processing Worker',tag:'Linux / .NET Worker',summary:'ثبت صحیح تاریخچه، انتساب زمانی، حذف اثر تکرار و ساخت تصویر جاریِ قابل اعتماد.',confirmed:['اعتبارسنجی مختصات، حذف اثر تکرار و جهش غیرمنطقی؛ حفظ دادهٔ دیررس بدون عقب‌بردن وضعیت جاری.','فقط موقعیت و زمان در فاز اول؛ مقادیر نامعلوم nullable و بدون ساختن صفر، ignition، سوخت یا علت قطع ارتباط.','در نبود انتساب معتبر، تخلف به راننده نسبت داده نشود.'],responsibilities:['تراکنش تاریخچه، dedup، تغییر وضعیت واجد شرایط و outbox.','انتساب دستگاه/کامیون/راننده/منطقه بر اساس زمان رویدادِ قابل اعتماد و ثبت منشأ تصمیم.','به‌روزرسانی اتمیک موقعیت جاری با ترتیب زمان و tie-breaker مصوب.','تولید projection حرکت/توقف، کیفیت پوشش و هشدار؛ نسخه‌گذاری الگوریتم و تنظیمات.','مصرف partitionشده یا هم‌زمانی کنترل‌شده برای جلوگیری از رقابت روی یک دستگاه.'],data:'telemetry.PositionHistory / CurrentPositions، سابقهٔ heartbeat، dedup و integration.Outbox؛ خلاصه‌های تحلیلی بازساخت‌پذیر.',risks:['انتساب با receivedAt به‌جای eventTime، دادهٔ بافرشده را به منطقه یا رانندهٔ اشتباه می‌دهد.','رویدادهای قدیمی نباید موقعیت جاری یا هشدار زنده را به گذشته برگردانند.','اصلاح انتساب تاریخی باید projection و دسترسی را با سیاست مشخص اصلاح کند.'],tests:['رویداد خارج از ترتیب، دادهٔ هم‌زمان، duplicate پس از commit، مرز انتقال منطقه و ساعت نامعتبر.'],decisions:['D13','D02','D07','D11','D12'],links:['database','fleet','broker','alerts','reports','web']},
 database:{title:'داده و SQL Server',en:'SQL Server',tag:'Windows Server VM',summary:'منبع پایدار دادهٔ عملیاتی و تاریخچه با حجم بالقوهٔ چندمیلیارد رکورد در سال.',confirmed:['Microsoft SQL Server در VM ویندوز؛ تاریخچهٔ نرمال ۳۶۵ روز، بستهٔ خام ۳۰ روز.','انتساب‌های زمان‌دار، جلوگیری از هم‌پوشانی ناخواسته و حذف دوره‌ای قابل ممیزی.','backup و DR در اختیار زیرساخت است؛ برنامه باید از restore و migration سازگار پشتیبانی کند.'],responsibilities:['یک دیتابیس اولیه با schemaهای مالکیت‌دار؛ جداسازی منطقی دادهٔ عملیاتی، telemetry، alert، command و audit.','EF Core برای دادهٔ اداری؛ benchmark برای bulk/batched write یا staging در telemetry.','آزمون partition روزانه، compression و index متناسب با بار؛ current projection برای صفحهٔ زنده.','تراکنش outbox و dedup؛ مهاجرت توسط هویت اختصاصی deployment، نه startup خودکار تولید.','قواعد [start,end)، انتساب نامشخص بدون جعل truck/driver؛ تاریخچهٔ correction و attribution provenance.'],data:'نمودار مفهومی، schemaها و برنامهٔ migration در صفحهٔ «مدل داده» آمده است.',risks:['در بار فرضی ۱۰۰۰ دستگاه و ۵ ثانیه، ۶٫۳۰۷۲ میلیارد fix در ۳۶۵ روز.','partitioning به‌تنهایی سرعت query را تضمین نمی‌کند؛ طراحی uniqueness و index باید هماهنگ باشد.','SQL temporal auditing جای business-effective assignment را نمی‌گیرد.'],tests:['بار هم‌زمان write/report، migration نسخهٔ قبل، restore، expiry دادهٔ دیررس و حذف در حجم واقعی.'],decisions:['D06','D07','D12'],links:['processor','raw','reports','operations']},
 web:{title:'وب، API و نمایش زنده',en:'ASP.NET Core / Blazor / SignalR',tag:'Linux application',summary:'پنل داخلی اپراتورها، APIهای مجاز و ارسال تغییرات زنده به کاربران مجاز.',confirmed:['نماد نقشه باید حرکت، توقف، کهنگی و وضعیت نامشخص را تفکیک کند؛ موقعیت به‌تنهایی روشن/خاموش بودن موتور را نشان نمی‌دهد. قطع دریافت داده دلیل قطع برق نیست.','همهٔ تاریخ‌های نمایشی کاربر جلالی هستند؛ این تصمیم قفل شده است. انتخابگر/فیلتر تاریخ، live/history/playback، هشدار، انتساب، فرمان و صفحهٔ مشتری نیز مشمول‌اند؛ ذخیره‌سازی UTC باقی می‌ماند.','ASP.NET Core، Blazor، SignalR؛ مجوز سمت سرور برای API، گزارش، export و subscription.','نمایش سرعت، جهت در صورت وجود، زمان fix و زمان دریافت و علامت‌گذاری دادهٔ کهنه.','داشبورد وضعیت، جست‌وجو/فیلتر، تاریخچهٔ ۲۴ ساعت، ۷ روز و بازهٔ دلخواه تا محدودهٔ retention؛ playback.'],responsibilities:['پیشنهاد اولیه: Blazor Interactive Server برای کاربران داخلی؛ اعتبارسنجی با تعداد اپراتور و tab واقعی.','SignalR برای تغییر وضعیت جاری؛ HTTP صفحه‌بندی‌شده و ساده‌سازی تدریجی برای تاریخچه و playback.','پس از reconnect، snapshot مجاز دریافت شود؛ سپس deltaهای زنده ادامه یابد.','در scale-out: fan-out همهٔ Web instanceها، affinity متناسب، کلیدهای مشترک Data Protection و کنترل اتصال.','subscription در تغییر مجوز/منطقه یا ابطال session دوباره ارزیابی و قطع شود.'],data:'snapshot و projection جاری از SQL؛ رویداد commitشده برای fan-out؛ هیچ دسترسی مستقیم مرورگر به SQL یا RabbitMQ.',risks:['تعداد دستگاه معیار کافی برای sizing Web نیست؛ circuitها و map tabها نیز مصرف دارند.','صف مصرف رقابتیِ واحد می‌تواند update را فقط به یک instance برساند.','نمایش position قدیمیِ منطقهٔ قبلی پس از transfer می‌تواند نقض دسترسی باشد.'],tests:['بررسی جلالی بودن همهٔ تاریخ‌های UI، انتخابگر و بازه‌ها، مرز ماه/سال و کبیسه؛ تبدیل بازه به UTC پس از تعیین timezone.','چند مرورگر و reconnect، تغییر نقش زنده، ابطال لینک، نشت بین مناطق و رندر نقشهٔ پرتراکم.'],decisions:['D13','D01','D02','D06','D08','D10'],links:['identity','fleet','sharing','maps','broker','database']},
 fleet:{title:'ناوگان و انتساب‌های زمانی',en:'Fleet & Assignments',tag:'Application module',summary:'مدیریت کامیون، راننده، منطقه، مشتری، دستگاه و SIM با حفظ معنای تاریخچه.',confirmed:['ثبت کامیون، دستگاه، SIM، راننده، منطقه، مشتری و کاربران.','انتساب راننده به کامیون و کامیون به منطقه زمان‌دار و قابل تغییر است.','منطقهٔ قبلی فقط تاریخچهٔ دورهٔ انتساب خود را می‌بیند؛ دادهٔ جدید پس از انتقال در دسترسش نیست.','راننده در فاز اول ورود ندارد؛ trip/route یا مبدأ/مقصد اجباری نیست و توقف پایان سفر محسوب نمی‌شود.'],responsibilities:['بازه‌های نیمه‌باز [start,end) و کنترل تراکنشی هم‌پوشانی، حتی در درخواست هم‌زمان.','سابقهٔ اتصال دستگاه به کامیون و SIM به دستگاه؛ جلوگیری از اختلاط داده هنگام تعویض سخت‌افزار.','اصلاح گذشته با مجوز محدود، audit و بازسازی projectionهای متاثر.','تاییدشده: منطقهٔ جدید تاریخچهٔ پیش از واگذاری را نبیند. مدیر ناوگان کل شرکت را می‌بیند و انتقال منطقه انجام می‌دهد؛ اپراتور منطقه می‌تواند راننده را در منطقهٔ مجاز تغییر دهد.'],data:'fleet.Trucks / Drivers / Regions / Customers و assignmentها؛ devices.Models / Devices / SimCards و سوابق اتصال.',risks:['ابهام مرز انتقال، تاریخ غلط، انتساب متداخل و تغییر گذشته می‌تواند هم گزارش و هم مجوز را عوض کند.'],tests:['انتقال در لحظهٔ دقیق start/end، دادهٔ دیررس، assignment ناموجود و دو تغییر هم‌زمان.'],decisions:['D02','D07'],links:['identity','processor','database','sharing']},
 identity:{title:'هویت و مجوزها',en:'Identity & Authorization',tag:'Cross-cutting module',summary:'حساب محلی، RBAC و کنترل دسترسی روی منبع و زمان، نه صرفاً پنهان‌کردن منو.',confirmed:['بدون وابستگی AD؛ hashing قوی، MFA حساب ممتاز، lockout/rate-limit و session امن.','default deny و مجوز سمت سرور در query، گزارش، export و SignalR.','استثنای موقت دسترسی توسط مدیر ارشد، با دامنه و انقضا و ثبت audit.'],responsibilities:['قابلیت‌های مجزا به‌جای شرط نام نقش؛ سیاست مشترک برای تمام مسیرهای خواندن و نوشتن.','محدودهٔ منطقه بر اساس interval رویداد؛ عدم انتساب صرف به منطقهٔ فعلی کامیون.','پاسخ مثبت مدیر فنی به معنی مشاهدهٔ موقعیت زنده برداشت شده؛ دامنهٔ خودرو/منطقه هنوز باز است و تاریخچه/گزارش از آن نتیجه نمی‌شود. دسترسی raw جداست.','CSRF/XSS/SQL injection، کلیدگردانی، خروج/ابطال session و بازیابی MFA.'],data:'identity.Users / Roles / UserRoleAssignments / UserRegionGrants؛ audit فعالیت حساس و نسخهٔ تنظیمات.',risks:['منو و group نام‌گذاری‌شدهٔ SignalR خودِ مجوز نیستند.','مجوز cacheشده در اتصال زنده پس از انتقال یا revocation نباید معتبر بماند.'],tests:['ماتریس اجازه/رد، دسترسی با شناسهٔ حدسی، export و history بین مناطق و ابطال اتصال فعال.'],decisions:['D02','D10'],links:['web','fleet','sharing','security']},
 alerts:{title:'هشدار و گردش تأیید',en:'Alerts & Acknowledgment',tag:'Application module',summary:'تشخیص قابل توضیحِ سرعت، توقف طولانی و قطع ارتباط با جلوگیری از طوفان هشدار.',confirmed:['هشدار سرعت، توقف طولانی و offline؛ تأیید اپراتور و audit.','محدودیت سرعت پیش‌فرض سازمان، override گروه و خودرو؛ road limit فقط با منبع معتبر.','آستانهٔ offline مرکزی؛ override هر دستگاه به فاز بعد موکول است.','مکان، زمان، سرعت مشاهده‌شده، limit اعمال‌شده، وضعیت و acknowledgment ثبت شود.'],responsibilities:['قاعده، tolerance، cooldown و dedup نسخه‌دار و مرکزی.','تمایز ارتباط دستگاه، تازگی GPS و حرکت؛ heartbeat سالم الزاماً fix تازه نیست.','تفکیک هشدار تاریخیِ دادهٔ دیررس از incident زنده؛ نگهداری evidence و انتساب معتبر راننده.','تعیین کانال اطلاع‌رسانی در مرحلهٔ تصمیم‌گیری؛ SMS اعلان هنوز مصوب نیست.'],data:'alerts.Rules / Alerts / AlertAcknowledgments؛ زمان و نسخهٔ config و شواهد محاسبه.',risks:['چراغ قرمز و GPS drift نباید توقف مهم تلقی شوند.','نامعلوم‌بودن محدودیت جاده نباید به ادعای تخلف قانونی تبدیل شود.'],tests:['مرز threshold، cooldown، بازپخش، assignment مبهم و duplicate بدون ایجاد اثر تکراری.'],decisions:['D07','D11'],links:['processor','fleet','reports','identity']},
 reports:{title:'تحلیل، گزارش و playback',en:'Analytics & Reports',tag:'Application module',summary:'محاسبه از GPS با پوشش و محدودیت روشن؛ خواندن بهینهٔ تاریخچهٔ طولانی.',confirmed:['فقط موقعیت و زمان: مدت حرکت، کارکرد موتور یا حضور راننده را اثبات نمی‌کند. مصرف سوخت و کارکرد درجای موتور در این فاز در دسترس نیست.','تاریخ‌های نمایشی گزارش، فیلتر تاریخ و خروجی Excel/چاپ باید جلالی باشند؛ timestamp داخلی UTC باقی می‌ماند.','مسافت GPS بدون odometer؛ زمان حرکت/توقف، تعداد توقف، حداکثر سرعت، offline و completeness.','رتبه‌بندی بیشترین/کمترین/صفر مسافت، ستون انتخابی و خروجی Excel.','حداقل توقف گزارش توسط اپراتور قابل انتخاب است؛ آستانهٔ هشدار مرکزی و جداست.','در شکاف پوشش مسافت واقعی حدس زده نشود؛ موقعیت نامعتبر، duplicate و جهش فیلتر شوند.'],responsibilities:['segment و خلاصهٔ روزانهٔ بازساخت‌پذیر با نسخهٔ الگوریتم و provenance.','محاسبهٔ denominator پوشش مطابق cadence واقعی و وضعیت دستگاه؛ سیاست gap و late correction مصوب شود.','query محدود و incremental، export پس‌زمینه، سهمیهٔ هم‌زمانی؛ رعایت scope هنگام اجرا و تحویل فایل.','playback با pagination و display simplification؛ نمایش ساده‌شده جایگزین دادهٔ اصلی نشود.'],data:'analytics.MovementSegments / DailySummaries / Coverage؛ خواندن کنترل‌شدهٔ PositionHistory.',risks:['سالانه هر دستگاه در cadence پنج‌ثانیه‌ای می‌تواند بیش از ۶ میلیون نقطه داشته باشد.','گزارش سنگین هم‌زمان با ingest می‌تواند SQL و freshness را مختل کند.','عدم داده با صفر مسافت یکسان نیست؛ رتبه‌بندی باید کیفیت پوشش را نشان دهد.'],tests:['تطبیق تاریخ جلالی UI و Excel/چاپ با timestamp اصلی، مرز ماه/سال/کبیسه و صحت بازهٔ UTC پس از تعیین timezone.','مسیرهای معلوم، شکاف پوشش، توقف با آستانهٔ متفاوت، مقایسهٔ summary با raw normalized و workload ترکیبی.'],decisions:['D13','D06','D08','D11','D12'],links:['database','processor','alerts','web']},
 commands:{title:'فرمان دستگاه و SMS',en:'Device Commands & SMS',tag:'Linux / Integration Worker',summary:'کنترل پیکربندی از داخل سامانه با وضعیت واقعی هر مرحله، نه فرض موفقیت با ارسال SMS.',confirmed:['عملیات تکی/گروهی از داخل سامانه؛ provider دوطرفه با API مستند.','قالب مدل، correlation، retry، timeout و audit؛ توان verification به قابلیت دستگاه بستگی دارد.','تمایز submitted، delivered، device replied و setting verified.'],responsibilities:['ثبت command و outbox پیش از dispatch، تلاش مستقل، محدودیت batch و reconciliation.','اعتبارسنجی callback provider، replay protection و پردازش idempotent.','retry متناسب با خطر و idempotency فرمان؛ پس از timeout حالت «نتیجه نامعلوم» قابل نمایش باشد.','تعیین allowlist و نقش مجاز فرمان؛ محرمانه‌سازی کلید provider و متن‌های حساس.'],data:'commands.DeviceCommands / CommandAttempts / SmsProviderMessages؛ پاسخ یا verification اجباری ساختگی نیست.',risks:['timeout دلیل کافی برای تکرار فرمان غیر idempotent یا حساس نیست.','callback جعلی، پاسخ بدون correlation و هزینه/rate limit ارائه‌دهنده.','فرمان‌های دارای اثر ایمنی، به‌ویژه ناوگان مواد خطرناک، نیازمند سیاست مصوب هستند.'],tests:['موفقیت هر مرحله، پاسخ دیررس/تکراری، timeout پس از ارسال، callback جعلی و عملیات گروهی محدود.'],decisions:['D05','D09'],links:['adapters','identity','database','operations']},
 sharing:{title:'اشتراک موقت با مشتری',en:'Customer Tracking Sessions',tag:'Restricted application surface',summary:'لینک محدود و قابل ابطال برای یک کامیون در یک بازه؛ بدون نمایش سایر ناوگان.',confirmed:['session دستی شامل کامیون، مشتری، start/end و مرجع اختیاری محموله.','لینک غیرقابل‌حدس، منقضی‌شونده و قابل ابطال؛ token به‌صورت hash ذخیره شود.','دادهٔ زنده بدون تأخیر عمدی با نمایش تازگی fix؛ پرتال جامع و integration dispatch خارج از فاز اول.'],responsibilities:['کنترل session فعال، بازهٔ مجاز و event time؛ عدم نمایش fix بافرشدهٔ خارج از بازه.','محدودسازی payload، عدم نشت token در log/referrer و محدودکردن درخواست.','ابطال فعال subscription و کش؛ انتخاب token lifetime و verification اضافه با توجه به محموله.','در صورت اینترنتی‌شدن، gateway و سطح انتشار مستقل، TLS و security review پیش از انتشار.'],data:'sharing.TrackingSessions / TrackingTokens؛ دسترسی پیش‌فرض فقط live session، نه تاریخچهٔ آزاد.',risks:['تعارض دسترسی داخلی اولیه با customer link عمومی نیازمند تصمیم است.','last position پیش از activation می‌تواند دامنهٔ session را نقض کند؛ سیاست نمایش باید مشخص باشد.'],tests:['انقضا در اتصال فعال، revoke، دسترسی به کامیون دیگر، زمان‌بندی activation و delayed fix.'],decisions:['D02','D10'],links:['web','identity','fleet','security']},
 maps:{title:'نقشهٔ آفلاین ایران',en:'Offline Map Infrastructure',tag:'Independent Linux service',summary:'نمایش نقشه بدون وابستگی اینترنتی با داده و مجوز روشن.',confirmed:['tiles، styles، fonts و assets محلی؛ MapLibre GL JS یا معادل self-hosted.','دادهٔ دارای مجوز و attribution مناسب؛ بازنشر Google بدون مجوز مجاز نیست.','استقلال اینترنتی نمایش نقشه به‌معنای استقلال تحویل cellular نیست.'],responsibilities:['ارزیابی vector tiles ایران، pipeline تولید/خرید مجاز و zoom مورد نیاز.','نسخه‌گذاری dataset، refresh، تست پوشش، rollback و بررسی glyph فارسی/انگلیسی.','بسته‌بندی محلی renderer، sprite، font و script؛ آزمون با خروجی اینترنت قطع.','دادهٔ محدودیت سرعت جاده مستقل ارزیابی شود؛ از وجود tile نتیجهٔ وجود speed limit معتبر نگیریم.'],data:'dataset و metadata نسخه‌دار نقشه؛ SQL فقط در صورت نیاز metadata عملیاتی را نگه می‌دارد.',risks:['دانلود انبوه از tile server عمومی OSM برای offline مجاز نیست.','هزینهٔ disk/build در zoom بالا و تفاوت کیفیت پوشش؛ CDN پنهان در style/font.'],tests:['بارگذاری بدون اینترنت، zoomهای منتخب، attribution، نمایش متن فارسی و refresh/rollback.'],decisions:['D08','D12'],links:['web','operations','security']},
 raw:{title:'بستهٔ خام و شواهد',en:'Raw Packet Archive',tag:'Restricted storage',summary:'نگهداری کوتاه‌مدت برای عیب‌یابی پروتکل با کنترل محرمانگی و چرخهٔ حذف.',confirmed:['نگهداری جداگانهٔ raw packet برای ۳۰ روز، با کنترل دسترسی و حریم خصوصی.','مرجع خام در normalized event در صورت وجود.'],responsibilities:['پیشنهاد: storage محافظت‌شده با سازمان‌دهی زمانی و index متادیتا در SQL.','تعریف reference پایدار، integrity check، رمزنگاری و ثبت خواندن حساس.','هماهنگ‌کردن expiry فایل و index، جلوگیری از log بی‌حد بایت‌های حساس.','تصمیم جداگانه دربارهٔ archive، durable journal و رابطهٔ هر کدام با ACK.'],data:'telemetry.DeviceRawPacketIndex و payload خارج از جدول پرتردد؛ این انتخاب نیازمند تایید دوام است.',risks:['نوشتن raw و RabbitMQ ذاتاً atomic نیست؛ نمودار تضمین dual-write ایجاد نمی‌کند.','expiry فایل اصلی، backup یا copyهای جانبی را خودکار حذف نمی‌کند.'],tests:['شکست یکی از دو نوشتن، crash، فایل ناموجود، کنترل مجوز و expiry دقیق.'],decisions:['D03','D04','D12'],links:['receiver','database','security','operations']},
 simulator:{title:'شبیه‌ساز مستقل GPS',en:'GPS Simulator',tag:'Development / Test only',summary:'تولید بار و سناریوهای تکرارپذیر از طریق socket واقعی برای آزمون مسیر انتها‌به‌انتها.',confirmed:['سرویس مستقل .NET؛ هیچ کنترل شبیه‌سازی در UI تولید وجود نداشته باشد.','شناسه‌های مجزا، حرکت/توقف، گوشهٔ مسیر، buffering، reconnect، delay، out-of-order و duplicate.','شبیه‌ساز ابتدا می‌تواند هم‌میزبان receiver باشد؛ benchmark معتبر نیازمند جداسازی منابع است.'],responsibilities:['seed قطعی، clock و سناریوی نسخه‌دار، ledger رویداد مورد انتظار و تنظیم cadence.','عبور از framing واقعی TCP/UDP؛ تزریق مستقیم داخل processor آزمون receiver محسوب نمی‌شود.','آداپتر Synthetic با برچسب واضح تا دریافت مستندات vendor؛ protocol-accurate فقط برای adapter تاییدشده.','خرابی DB/broker، rollover، چند fix در بسته، مختصات نامعتبر و reconnect storm.'],data:'fixture و نتایج تست در محیط غیرتولید؛ داده و secret آزمون به تولید منتقل نشود.',risks:['شبیه‌سازی اثبات سازگاری سخت‌افزار نیست.','رقابت CPU/network با receiver می‌تواند اندازه‌گیری را مخدوش کند.'],tests:['reproducibility، صحت ledger و reconciliation، بار ۳۰۰/۱۰۰۰ و characterization در ۵۰۰۰ دستگاه.'],decisions:['D03','D05','D06'],links:['receiver','adapters','processor','operations']},
 operations:{title:'استقرار و مشاهده‌پذیری',en:'Deployment & Operations',tag:'On-premises / VMware',summary:'اجرای قابل تکرار، اندازه‌گیری قابل اعتماد و بازیابی آزموده‌شده.',confirmed:['محیط dev/test پیش از تولید؛ promotion با script تکرارپذیر بدون انتقال داده یا secret آزمایشی.','log ساختاریافته، metric، trace، health، queue depth و ingestion lag داخل سازمان.','release امضاشده، least privilege، SBOM/dependency scan و تست امنیت پیش از انتشار اینترنتی.'],responsibilities:['Linux برای Web/receiver/processor/integration/map و Windows برای SQL؛ zoneبندی و allowlist جریان‌ها.','VM sizing بر پایهٔ mixed workload؛ failure domain مستقل در HA منتخب؛ Kubernetes فعلاً الزامی نیست.','readiness/liveness مناسب، disk/backlog alarm، dead-letter و runbook بازیابی.','کلید، certificate، patch، NTP/time و package آفلاین با مالک مشخص؛ بازیابی کلیدهای Data Protection.','اندازه‌گیری latency داخلی و event-to-screen جداگانه؛ restore واقعی و backlog drain زیر بار جدید.'],data:'متریک‌ها، trace و log با retention مصوب؛ از ثبت token، secret و raw نامحدود اجتناب شود.',risks:['تعداد VM تضمین HA نیست؛ SQL، gateway، storage و شبکه هم failure point دارند.','backup موفق بدون restore drill شاهد کافی برای RTO/RPO نیست.'],tests:['deploy پاک، upgrade، rollback، restore، offline map و soak/recovery با بار هم‌زمان.'],decisions:['D03','D06','D12'],links:['broker','database','security','simulator']},
 security:{title:'مرزهای امنیتی',en:'Security & Trust Boundaries',tag:'Cross-cutting architecture',summary:'مدل تهدید از دستگاه و پیام تا حساب، لینک مشتری و زیرساخت.',confirmed:['default deny بین zoneها؛ SQL و RabbitMQ management عمومی نشوند.','TLS مرورگر/API و دستگاهِ پشتیبان TLS؛ plaintext device ایزوله و ورودی نامطمئن تلقی شود.','کنترل امنیت، secret injection، rotation، audit و تست پیش از انتشار اینترنتی.'],responsibilities:['مرز ورود دستگاه، مرز internal application و سطح customer gateway جدا طراحی شوند.','بازبینی جعل دستگاه، parser DoS، replay، cross-region leakage و سرقت لینک.','قابلیت محدود برای raw و command؛ امضای انتشار و least-privilege identity.','محدودکردن آسیب با scope زمانی/منبع، expiration و کنترل ابطال اتصال زنده.'],data:'مدل تهدید و permission matrix در صفحهٔ امنیت؛ جزئیات عملیاتی حساس نباید در نسخهٔ عمومی مستند منتشر شود.',risks:['IMEI لزوماً credential نیست؛ TLS سرور نیز به‌تنهایی هویت دستگاه را اثبات نمی‌کند.','حساب ممتاز و دسترسی storage می‌تواند دادهٔ مکانی حساس را افشا کند.'],tests:['authorization منفی، fuzz، rate limit، session/token lifecycle، webhook replay و review وابستگی‌ها.'],decisions:['D02','D04','D09','D10'],links:['identity','sharing','receiver','commands','operations']}

const decisions=[

['D02','پیش از Stage A','ماتریس مجوز و تاریخچهٔ منطقه','تایید شده: مدیر ناوگان سراسری و انتقال منطقه؛ تغییر راننده توسط اپراتور منطقه؛ عدم نمایش تاریخچهٔ پیش از واگذاری؛ فرمان گروهی فقط مدیر فنی.','باز: دامنهٔ موقعیت زندهٔ مدیر فنی، اصلاح گذشته و سایر مجوزهای تعیین‌نشده؛ استثنای موقت ممیزی‌شده مطابق مشخصات محفوظ است.'],
['D03','پیش از Stage A/B','SLO، فقدان داده و بازیابی','RPO، RTO، دسترس‌پذیری، بیشترین outage، سقف backlog و زمان drain چیست؟','پیشنهاد: تعریف failure envelope و هدف عدم فقدان دادهٔ durably acknowledged در آن محدوده؛ latency رویداد تا UI و receiver تا UI جدا سنجیده شود.'],
['D04','پیش از Stage B','مرز دوام و ACK','برای هر پروتکل ACK به broker confirm، journal محلی یا مرز دیگری وابسته باشد؟','پیشنهاد: بر اساس deadline واقعی سخت‌افزار؛ رابطهٔ raw archive با دوام و سیاست disk-full صریح شود.'],
['D05','پیش از Stage B','مدل دستگاه و پروتکل','کدام vendor/model/firmware برای نمونه‌گیری و مستندسازی انتخاب می‌شود؟','پیشنهاد: پیش از خرید انبوه، endpoint قابل تنظیم، protocol مستند، SMS، buffering، power و امنیت روی نمونه تایید شود.'],
['D06','پیش از sizing تولید','زیرساخت و بار واقعی','تعداد کاربران/tab/customer هم‌زمان، edition/version SQL، منابع VMware و بودجهٔ HA چیست؟','پیشنهاد: mixed benchmark پیش از تخصیص VM؛ quorum سه‌گرهی در failure domain مستقل در صورت تایید HA.'],
['D07','پیش از Stage C','زمان و انتساب','سیاست overlap، اصلاح گذشته، timestamp نامعتبر، دادهٔ نامنتسب و late-arrival چیست؟','پیشنهاد: event-time معتبر، بازهٔ [start,end)، correction محدود با audit و بازسازی projection؛ عدم جعل راننده/کامیون.'],
['D08','تقویم تایید و قفل شده؛ سایر موارد باز','نمایش و نقشه','تاییدشده: تمام تاریخ‌های نمایشی کاربر جلالی، شامل صفحات، انتخابگر تاریخ، گزارش و خروجی. زبان، timezone نمایش، قالب ساعت/ارقام، مرورگر و جزئیات نقشه هنوز باز هستند.','ذخیره‌سازی و قراردادهای ماشینی UTC باقی می‌مانند؛ تبدیل در مرز نمایش و فیلتر جلالی به بازهٔ UTC انجام شود. تغییر تقویم نیازمند تایید صریح کاربر است.'],
['D09','پیش از Stage D','SMS و فرمان‌های مجاز','provider، inbound security، correlation، rate limit و سیاست retry/تایید فرمان کدام است؟ اجرای گروهی فقط توسط مدیر فنی تایید شده است.','پیشنهاد: allowlist قابلیت، batch محدود؛ برای فرمان حساس یا غیر idempotent پس از timeout تکرار کور انجام نشود.'],
['D10','پیش از Stage D','اشتراک مشتری','لینک در فاز اول داخلی است یا اینترنتی؟ عمر token، activation/deactivation و verification اضافه چیست؟','پیشنهاد: انتشار خارجی یک تصمیم مستقل؛ محدودیت زمانی رویداد، revocation فعال و حداقل payload.'],
['D11','پیش از Stage D','حرکت، هشدار و پوشش','حد سرعت و tolerance، stop/motion، offline، cooldown، lateness و کانال اعلان چیست؟','پیشنهاد: تنظیمات مرکزی نسخه‌دار؛ ارتباط دستگاه از freshness GPS جدا؛ آستانهٔ توقف گزارش با هشدار جدا باشد.'],
['D13','پیش از Stage C/D','پیشنهادهای تیم با دادهٔ GPS','تعریف سرعت متوسط، مدت حرکت بیش از چهار ساعت، فیلتر توقف و قطعی، شماره هوشمند، گزارش مقایسه‌ای و خلاصه چیست؟ تست ایرانسل، پارکینگ، گارانتی و سکوی بیرونی دقیقاً چه معنایی دارند؟','فقط دادهٔ موقعیت و زمان در فاز اول تایید شده؛ مصرف سوخت، سوئیچ، قطع برق و کارکرد درجای موتور قابل تشخیص نیستند. پیشنهادهای جدید تا تایید صریح وارد دامنه نمی‌شوند.'],
['D12','پیش از readiness','retention و مالکیت عملیات','۳۶۵ روز یا سال تقویمی؟ مبنای expiry برای دیررس‌ها، audit/command/aggregate retention و مالکان عملیات چیست؟','پیشنهاد: rolling window دقیق، سیاست backup/copy، حذف قابل ممیزی و مالک مشخص برای restore، map refresh، certificate و key.']
];

function renderModule(id){const item=modules[id];return intro(item.en,item.title,item.summary)+`<div class="legend">${badge(item.tag)}${badge('طراحی پیشنهادی؛ پیش از پیاده‌سازی','open')}</div><h2>الزامات تاییدشدهٔ مرتبط</h2>`+list(item.confirmed)+`<h2>مسئولیت‌ها و طراحی پیشنهادی</h2>`+list(item.responsibilities)+`<h2>داده و مرز تعامل</h2><p>${item.data}</p><div class="split"><section><h2>ریسک‌های اصلی</h2>${list(item.risks)}</section><section><h2>آزمون و پذیرش</h2>${list(item.tests)}</section></div><h2>وابستگی‌ها و ماژول‌های مرتبط</h2>`+relationLinks(item.links)+`<h2>تصمیم‌های باز این ماژول</h2><div class="relations">${item.decisions.map(key=>`<a href="#decisions/${key}">${key} · ${decisions.find(row=>row[0]===key)[2]}</a>`).join('')}</div><p class="small">هر تصمیم به صفحهٔ موضوع مربوط باز می‌شود؛ هیچ انتخابی در این فایل به‌عنوان تایید الزامات ذخیره نمی‌شود.</p>`;}
function renderNavigation(){const query=document.getElementById('nav-search').value.trim().toLocaleLowerCase('fa');const pageLinks=Object.entries(pageTitles).filter(([key,title])=>(title+' '+key).toLocaleLowerCase('fa').includes(query));const moduleLinks=Object.entries(modules).filter(([key,item])=>(item.title+' '+item.en+' '+item.summary+' '+key).toLocaleLowerCase('fa').includes(query));document.getElementById('navigation').innerHTML=`<div class="nav-label">بخش‌های گزارش</div>${pageLinks.map(([key,title])=>`<a href="#${key}">${title}</a>`).join('')}<div class="nav-label">جزئیات ماژول‌ها</div>${moduleLinks.map(([key,item])=>`<a class="module-nav" href="#module/${key}">${item.title}</a>`).join('')}${!pageLinks.length&&!moduleLinks.length?'<p class="empty" role="status">بخشی با این عبارت پیدا نشد.</p>':''}`;setActive();}
function setActive(){const hash=location.hash||'#overview';document.querySelectorAll('#navigation a').forEach(anchor=>{if(anchor.getAttribute('href')===hash||hash.startsWith(anchor.getAttribute('href')+'/'))anchor.setAttribute('aria-current','page');else anchor.removeAttribute('aria-current');});}
function route(){const parts=location.hash.slice(1).split('/');const page=parts[0]||'overview';let title,body;if(page==='module'&&Object.hasOwn(modules,parts[1])){title=modules[parts[1]].title;body=renderModule(parts[1]);}else if(Object.hasOwn(pageRenderers,page)){title=pageTitles[page];body=pageRenderers[page]();}else{title='صفحه پیدا نشد';body=intro('NOT FOUND',title,'این نشانی در سند موجود نیست. از فهرست یا لینک زیر استفاده کنید.')+'<a href="#architecture">بازگشت به نمودار معماری</a>';}
