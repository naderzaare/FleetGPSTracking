services:
  gps-receiver:
    build:
      context: ..
      dockerfile: src/GpsReceiver/Dockerfile
    image: fleet-gps-receiver:local
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    ports:
      - "5027:5027/tcp"
    environment:
      GPS_CAPTURE_DIR: /data/captures
      GPS_IDLE_SECONDS: "180"
      GPS_MAX_CONNECTIONS: "100"
      GPS_MAX_FRAME_BYTES: "65536"
      GPS_ALLOWED_IMEIS: ${GPS_ALLOWED_IMEIS:-}
    volumes:
      - /srv/fleet-gps/captures:/data/captures
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
